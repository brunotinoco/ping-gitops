apiVersion: v1
kind: Service

metadata:
  name: pingdirectory
  namespace: ping-gitops

spec:
  selector:
    app: pingdirectory

  ports:
    - name: ldap
      port: 1389
      targetPort: 1389

    - name: ldaps
      port: 1636
      targetPort: 1636

    - name: admin
      port: 4444
      targetPort: 4444

    - name: https
      port: 1443
      targetPort: 1443
