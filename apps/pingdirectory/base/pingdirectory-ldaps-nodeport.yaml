apiVersion: v1
kind: Service
metadata:
  name: pingdirectory-ldaps-nodeport
  namespace: ping-gitops

spec:
  type: NodePort

  selector:
    app: pingdirectory

  ports:
    - name: ldaps
      protocol: TCP
      port: 1636
      targetPort: 1636
      nodePort: 31636

  externalTrafficPolicy: Local
