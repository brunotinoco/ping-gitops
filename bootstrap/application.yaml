apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet

metadata:
  name: ping-gitops-bootstrap
  namespace: ping-gitops

spec:

  generators:

  - git:

      repoURL: git@github-ping:brunotinoco/ping-gitops.git

      revision: main

      directories:

      - path: apps/*

  template:

    metadata:

      name: '{{path.basename}}'

    spec:

      project: default

      source:

        repoURL: git@github-ping:brunotinoco/ping-gitops.git

        targetRevision: main

        path: '{{path}}/base'

      destination:

        server: https://kubernetes.default.svc

        namespace: ping-hml

      syncPolicy:

        automated:

          prune: true

          selfHeal: true
