apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: ping-gitops-bootstrap
  namespace: ping-gitops

spec:

  project: default

  source:
    repoURL: git@github-ping:brunotinoco/ping-gitops.git
    targetRevision: main
    path: apps

  destination:
    server: https://kubernetes.default.svc
    namespace: ping-gitops

  syncPolicy:

    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
