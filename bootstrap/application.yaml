apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: ping-gitops
  namespace: openshift-gitops

spec:

  project: default

  source:
    repoURL: https://github.com/brunotinoco/ping-gitops 
    targetRevision: main
    path: apps

  destination:
    server: https://kubernetes.default.svc
    namespace: ping-gitops

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
